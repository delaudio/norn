name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend gates
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run protocol:check
          pnpm run test
          pnpm run build

      - name: Run Rust gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          pnpm run test:rust:core
          pnpm run test:rust:cli
          pnpm run test:tauri

      - name: Run architecture gates
        run: |
          pnpm run version:verify
          npx -y archgate check

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: UI typecheck and tests
        working-directory: ui
        run: |
          bun run typecheck
          bun run frames:check
          bun test

  native-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build headless backend and command binary
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bin norn-backend --bin norn

      - name: Exercise native local capture, review, cancellation and restart
        run: bun run ui/scripts/check-local-workflow.tsx

      - name: Verify native editor argument and association adapters
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib repository_editor -- --test-threads=1

      - name: Exercise scoped native editor authorization and launch
        run: bun run ui/scripts/check-editor-ipc.ts

      - name: Exercise real terminal editor handoff and restoration
        run: bun run ui/scripts/check-editor-workflow.ts
