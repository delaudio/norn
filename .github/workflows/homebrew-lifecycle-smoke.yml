name: homebrew-lifecycle-smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag to validate (v<semver>). Defaults to package version."
        required: false
  schedule:
    - cron: "0 4 * * 2"
  pull_request:
    paths:
      - ".github/workflows/homebrew-lifecycle-smoke.yml"
      - ".github/workflows/release-norn-macos.yml"
      - "packaging/homebrew/norn.rb.template"
      - "packaging/homebrew/norn-cask.rb.template"
      - "docs/homebrew-distribution.md"
      - "scripts/homebrew-cask-lifecycle.sh"
      - "scripts/homebrew-formula-lifecycle.sh"
      - "scripts/render-homebrew-cask.mjs"
      - "scripts/render-homebrew-cask.test.mjs"
      - "scripts/render-homebrew-formula.mjs"
      - "scripts/render-homebrew-formula.test.mjs"
      - "scripts/release-channels.test.mjs"
      - "scripts/resolve-previous-homebrew-release.mjs"
      - "scripts/resolve-previous-homebrew-release.test.mjs"
      - "scripts/run-tooling-tests.mjs"
      - "scripts/run-with-timeout.mjs"
      - "scripts/run-with-timeout.test.mjs"
      - "scripts/validate-homebrew-manifests.mjs"
      - "scripts/validate-release-workflow.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate lifecycle tooling
        run: |
          node scripts/validate-release-workflow.mjs
          node scripts/run-tooling-tests.mjs
          node scripts/validate-homebrew-manifests.mjs
          bash -n scripts/homebrew-cask-lifecycle.sh
          bash -n scripts/homebrew-formula-lifecycle.sh
          bash -n scripts/verify-macos-app.sh

  lifecycle:
    if: github.event_name != 'pull_request'
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve candidate release
        id: release
        run: |
          set -euo pipefail
          release_tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="v$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable v<semver> syntax." >&2
            exit 1
          fi
          version="${release_tag#v}"
          base_url="https://github.com/delaudio/norn/releases/download/$release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "formula_url=$base_url/norn.rb" >> "$GITHUB_OUTPUT"
          echo "cask_url=$base_url/norn-cask.rb" >> "$GITHUB_OUTPUT"
          echo "architecture_url=$base_url/norn-$version-macos-${{ matrix.architecture }}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "arm64_url=$base_url/norn-$version-macos-arm64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "x86_64_url=$base_url/norn-$version-macos-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "desktop_arm64_url=$base_url/Norn-$version-macos-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "desktop_x86_64_url=$base_url/Norn-$version-macos-x86_64.dmg" >> "$GITHUB_OUTPUT"

      - name: Require complete stable command release assets
        run: |
          set -euo pipefail
          echo "phase=asset-check version=${{ steps.release.outputs.version }} architecture=${{ matrix.architecture }}"
          curl -fsI "${{ steps.release.outputs.arm64_url }}" >/dev/null
          curl -fsI "${{ steps.release.outputs.x86_64_url }}" >/dev/null
          curl -fsI "${{ steps.release.outputs.formula_url }}" >/dev/null

      - name: Require complete stable desktop release assets
        if: vars.NORN_DESKTOP_RELEASE_ENABLED == 'true'
        run: |
          set -euo pipefail
          echo "phase=desktop-asset-check version=${{ steps.release.outputs.version }} architecture=${{ matrix.architecture }}"
          curl -fsI "${{ steps.release.outputs.desktop_arm64_url }}" >/dev/null
          curl -fsI "${{ steps.release.outputs.desktop_x86_64_url }}" >/dev/null
          curl -fsI "${{ steps.release.outputs.cask_url }}" >/dev/null

      - name: Download and validate candidate formula
        run: |
          set -euo pipefail
          curl -fsSL "${{ steps.release.outputs.formula_url }}" -o "$RUNNER_TEMP/norn.rb"
          node scripts/validate-homebrew-manifests.mjs --formula "$RUNNER_TEMP/norn.rb"
          ruby -c "$RUNNER_TEMP/norn.rb"

      - name: Resolve previous stable formula
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ steps.release.outputs.release_tag }}
          NORN_HOMEBREW_BOOTSTRAP_TAG: ${{ vars.NORN_HOMEBREW_BOOTSTRAP_TAG }}
        run: node scripts/resolve-previous-homebrew-release.mjs

      - name: Download and validate previous stable formula
        if: steps.previous.outputs.bootstrap != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "${{ steps.previous.outputs.formula_url }}" -o "$RUNNER_TEMP/previous-norn.rb"
          node scripts/validate-homebrew-manifests.mjs --formula "$RUNNER_TEMP/previous-norn.rb"
          ruby -c "$RUNNER_TEMP/previous-norn.rb"

      - name: Validate clean install, upgrade or authorized bootstrap, uninstall, and reinstall
        env:
          CANDIDATE_FORMULA: ${{ runner.temp }}/norn.rb
          PREVIOUS_FORMULA: ${{ runner.temp }}/previous-norn.rb
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          NORN_ARCHITECTURE: ${{ matrix.architecture }}
          NORN_HOMEBREW_BOOTSTRAP: ${{ steps.previous.outputs.bootstrap }}
        run: bash scripts/homebrew-formula-lifecycle.sh

      - name: Download and validate candidate cask
        if: vars.NORN_DESKTOP_RELEASE_ENABLED == 'true'
        run: |
          set -euo pipefail
          curl -fsSL "${{ steps.release.outputs.cask_url }}" -o "$RUNNER_TEMP/norn-cask.rb"
          node scripts/validate-homebrew-manifests.mjs --cask "$RUNNER_TEMP/norn-cask.rb"
          ruby -c "$RUNNER_TEMP/norn-cask.rb"

      - name: Resolve previous stable desktop release
        if: vars.NORN_DESKTOP_RELEASE_ENABLED == 'true'
        id: previous-desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ steps.release.outputs.release_tag }}
          NORN_RELEASE_CHANNEL: desktop
          NORN_HOMEBREW_BOOTSTRAP_TAG: ${{ vars.NORN_HOMEBREW_BOOTSTRAP_TAG }}
        run: node scripts/resolve-previous-homebrew-release.mjs

      - name: Download and validate previous stable cask
        if: vars.NORN_DESKTOP_RELEASE_ENABLED == 'true' && steps.previous-desktop.outputs.bootstrap != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "${{ steps.previous-desktop.outputs.cask_url }}" -o "$RUNNER_TEMP/previous-norn-cask.rb"
          node scripts/validate-homebrew-manifests.mjs --cask "$RUNNER_TEMP/previous-norn-cask.rb"
          ruby -c "$RUNNER_TEMP/previous-norn-cask.rb"

      - name: Validate desktop install, upgrade or authorized bootstrap, uninstall, and reinstall
        if: vars.NORN_DESKTOP_RELEASE_ENABLED == 'true'
        env:
          CANDIDATE_CASK: ${{ runner.temp }}/norn-cask.rb
          PREVIOUS_CASK: ${{ runner.temp }}/previous-norn-cask.rb
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous-desktop.outputs.version }}
          NORN_ARCHITECTURE: ${{ matrix.architecture }}
          NORN_HOMEBREW_BOOTSTRAP: ${{ steps.previous-desktop.outputs.bootstrap }}
        run: bash scripts/homebrew-cask-lifecycle.sh

      - name: Remove desktop and formula after lifecycle test
        if: always()
        run: |
          if brew list --cask norn >/dev/null 2>&1; then
            brew uninstall --cask norn
          fi
          if brew list --formula norn >/dev/null 2>&1; then
            brew uninstall --formula norn
          fi
