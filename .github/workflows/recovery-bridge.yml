name: recovery-bridge

on:
  pull_request:
    paths:
      - .github/workflows/recovery-bridge.yml
      - scripts/verify-recovery-bridge.mjs
      - docs/user-data-recovery.md
      - docs/opentui-migration/user-data-recovery.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archived-desktop:
    name: archived-desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential curl file \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - name: Enable package manager
        run: corepack enable
      - name: Install source verifier dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the exact archived source and synthetic DOM formats
        run: node scripts/verify-recovery-bridge.mjs
      - name: Prepare isolated immutable recovery checkout
        run: git worktree add --detach "${{ runner.temp }}/norn-recovery" 72440eaef4177b809664bf6b563647d7659f3e52
      - name: Install archived dependencies
        working-directory: ${{ runner.temp }}/norn-recovery
        run: pnpm install --frozen-lockfile
      - name: Build archived production frontend
        working-directory: ${{ runner.temp }}/norn-recovery
        run: pnpm run build
      - name: Build embedded desktop binary without launching it
        working-directory: ${{ runner.temp }}/norn-recovery
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol,desktop-bundle --bin norn
      - name: Verify isolated legacy profile copying without launching a webview
        working-directory: ${{ runner.temp }}/norn-recovery
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib runtime_identity::tests::directory_migration
