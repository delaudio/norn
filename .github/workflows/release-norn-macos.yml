name: release-norn-macos

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version contract
        run: node scripts/release-guard.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Run frontend + Rust gates
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run test:tauri
          pnpm run build
          pnpm run version:verify
          node scripts/validate-homebrew-manifests.mjs
          if command -v archgate >/dev/null; then
            archgate check
          else
            npx -y archgate check
          fi

  build-macos-artifacts:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            architecture: x86_64
          - runner: macos-14
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: |
          node scripts/release-guard.mjs
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          artifacts_dir="dist/release-${{ matrix.architecture }}"
          mkdir -p "$artifacts_dir"

          cargo build --manifest-path src-tauri/Cargo.toml --release --bin norn --bin norn-tui

          tarball="norn-${version}-macos-${{ matrix.architecture }}.tar.gz"
          tar -czf "$artifacts_dir/$tarball" -C src-tauri/target/release norn norn-tui
          shasum -a 256 "$artifacts_dir/$tarball" > "$artifacts_dir/$tarball.sha256"

      - name: Publish build metadata
        run: |
          release_tag="${GITHUB_REF_NAME#v}"
          cat > "dist/release-${{ matrix.architecture }}/norn-${{ matrix.architecture }}-metadata.json" <<EOF
          {
            "version": "${release_tag}",
            "architecture": "${{ matrix.architecture }}",
            "runner": "${{ matrix.runner }}",
            "sha": "${GITHUB_SHA}",
            "workflow_run": "${GITHUB_RUN_ID}",
            "run_started": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: norn-macos-${{ matrix.architecture }}
          path: |
            dist/release-${{ matrix.architecture }}/*.tar.gz
            dist/release-${{ matrix.architecture }}/*.sha256
            dist/release-${{ matrix.architecture }}/*-metadata.json

  release:
    needs:
      - checks
      - build-macos-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Attach immutable release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.sha256
            release-artifacts/**/*-metadata.json
          fail_on_unmatched_files: true
          overwrite_files: false
