services:
  lachesi:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      LACHESI_SERVICE_DATA_DIR: /var/lib/lachesi
      LACHESI_SERVICE_BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - lachesi-data:/var/lib/lachesi
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "lachesi", "service", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  lachesi-data:
