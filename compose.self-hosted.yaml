services:
  # Keep the externally scripted service key through the compatibility window.
  # The image, process, environment, paths, and user-visible output are Norn.
  lachesi:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      NORN_SERVICE_DATA_DIR: /var/lib/norn
      NORN_SERVICE_BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      # Retain the existing named volume but mount it at Norn's canonical path.
      # The runtime copies lachesi.sqlite3 to norn.sqlite3 and keeps the source.
      - lachesi-data:/var/lib/norn
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "norn", "service", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  lachesi-data:
