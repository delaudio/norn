[package]
name = "norn"
version = "0.3.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop-bundle"]
# The Tauri desktop adapter. Everything Tauri-specific is gated behind this so
# the engine, headless CLI, and service can build without Tauri.
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-notification",
    "tauri/tray-icon",
]
# The Ratatui terminal UI. Gated so the engine and headless binaries build
# without a terminal toolkit during the OpenTUI migration.
tui = [
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:crossterm",
    "dep:ctrlc",
    "dep:image",
]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["desktop", "tauri/custom-protocol"]
desktop-bundle = ["desktop", "tui"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "norn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "norn"
path = "src/main.rs"

[[bin]]
name = "norn-tui"
path = "src/bin/norn-tui.rs"

[[bin]]
name = "norn-app"
path = "src/bin/norn-app.rs"

[[bin]]
name = "lachesi"
path = "src/bin/lachesi.rs"

[[bin]]
name = "lac"
path = "src/bin/lac.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
base64 = "0.22"
cap-fs-ext = "4"
cap-std = "4"
aes-gcm = "0.10"
getrandom = "0.2"
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
dirs = "5"
ratatui = { version = "0.29", optional = true }
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
crossterm = { version = "0.28", optional = true }
ctrlc = { version = "3", optional = true }
tempfile = "3"
libc = "0.2"
time = { version = "0.3", features = ["parsing"] }
unicode-segmentation = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
chrono = "0.4"
