[package]
name = "norn"
version = "0.2.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop-bundle"]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
desktop-bundle = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "norn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "norn"
path = "src/main.rs"

[[bin]]
name = "norn-tui"
path = "src/bin/norn-tui.rs"

[[bin]]
name = "norn-app"
path = "src/bin/norn-app.rs"

[[bin]]
name = "lachesi"
path = "src/bin/lachesi.rs"

[[bin]]
name = "lac"
path = "src/bin/lac.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
getrandom = "0.2"
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
dirs = "5"
ratatui = "0.29"
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
crossterm = "0.28"
ctrlc = "3"
tempfile = "3"
libc = "0.2"
time = { version = "0.3", features = ["parsing"] }
unicode-segmentation = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
chrono = "0.4"
